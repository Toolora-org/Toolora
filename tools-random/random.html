
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator | Toolora</title>

    <link rel="stylesheet" href="random.css">
</head>
<body>

    <header class="random-header">
        <a href="../index.html" class="back-home">← Back Home</a>
    </header>

    <main class="random-container">

        <h1>Random Number Generator</h1>
        <p>Generate random numbers instantly.</p>

        <section class="random-card">

            <label for="minNumber">Minimum number</label>
            <input type="number" id="minNumber" value="1">

            <label for="maxNumber">Maximum number</label>
            <input type="number" id="maxNumber" value="100">

            <label for="quantity">How many numbers?</label>
            <input type="number" id="quantity" value="1" min="1" max="100">

            <button id="generateBtn">Generate Numbers</button>

            <div class="random-result">
                <span>Your result</span>
                <div id="result">---</div>
            </div>

            <button id="copyBtn">Copy Result</button>

        </section>

    </main>

    <script src="random.js" defer></script>

</body>
</html>
